name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.1)'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup PowerShell
      shell: pwsh
      run: |
        # Install ps2exe module
        Install-Module ps2exe -Force -Scope CurrentUser
        Write-Host "ps2exe installed successfully"
    
    - name: Determine version
      shell: pwsh
      id: version
      run: |
        if ("${{ github.event_name }}" -eq "push") {
          $version = "${{ github.ref_name }}"
        } else {
          $version = "${{ github.event.inputs.version }}"
        }
        echo "version=$version" >> $env:GITHUB_OUTPUT
        echo "Building version: $version"
    
    - name: Build release
      shell: pwsh
      run: |
        # Find the latest PowerShell script in Archive
        $latestScript = Get-ChildItem .\Archive\*.ps1 | Sort-Object LastWriteTime -Descending | Select-Object -First 1
        
        if (-not $latestScript) {
          throw "No PowerShell script found in Archive folder"
        }
        
        Write-Host "Using source script: $($latestScript.FullName)"
        
        # Create build directory
        $buildDir = ".\build\ezFedMine"
        New-Item -ItemType Directory -Path $buildDir -Force
        
        # Compile PowerShell script to EXE
        ps2exe -inputFile $latestScript.FullName -outputFile "$buildDir\ezFedMine.exe" `
               -noConsole:$false `
               -requireAdmin:$false `
               -title "EZ Fed Mine" `
               -description "One-Click Monero P2Pool Miner" `
               -company "Ralph's Mining Tools" `
               -version "1.0.0.0" `
               -copyright "Open Source"
        
        # Copy documentation
        Copy-Item ".\README_ezFedMine.md" "$buildDir\README_ezFedMine.md"
        
        # Create version info
        $versionInfo = @"
        EZ Fed Mine - Release Information
        ================================
        
        Version: ${{ steps.version.outputs.version }}
        Build Date: $(Get-Date -Format "yyyy-MM-dd HH:mm:ss")
        Build Environment: GitHub Actions
        Commit: ${{ github.sha }}
        
        Contents:
        - ezFedMine.exe         Main executable
        - README_ezFedMine.md   User documentation
        
        Installation:
        1. Extract this ZIP to any folder
        2. Double-click ezFedMine.exe
        3. First run will download XMRig automatically
        4. Mining starts immediately after setup
        
        Pool Target: ralphfederated.duckdns.org:37888
        Wallet: 48ZRLsh2aiCAzRsCN4pxkAGtPLMUigXJmFaL2vwYKgFnLxCPbeQe2niYTU3DkF4QPAdULbQ8zCTop1MzPB3R81z88WEqjEk
        
        For support, contact Ralph with screenshots of any errors.
        "@
        
        $versionInfo | Out-File -FilePath "$buildDir\VERSION.txt" -Encoding UTF8
        
        # Create ZIP package
        $zipPath = "ezFedMine-${{ steps.version.outputs.version }}-windows-x64.zip"
        Compress-Archive -Path "$buildDir\*" -DestinationPath $zipPath
        
        # Calculate file hash
        $hash = Get-FileHash $zipPath -Algorithm SHA256
        echo "zip_path=$zipPath" >> $env:GITHUB_OUTPUT
        echo "zip_hash=$($hash.Hash)" >> $env:GITHUB_OUTPUT
        
        # Get file size
        $size = (Get-Item $zipPath).Length
        echo "zip_size=$([math]::Round($size / 1MB, 2)) MB" >> $env:GITHUB_OUTPUT
      id: build
    
    - name: Create Release Notes
      shell: pwsh
      run: |
        $releaseNotes = @"
        # EZ Fed Mine ${{ steps.version.outputs.version }}
        
        ## 🚀 What's New
        - Fresh build compiled on $(Get-Date -Format "MMMM dd, yyyy")
        - Latest PowerShell source with ps2exe compilation
        - Tested for Windows 10/11 compatibility
        
        ## 📥 Download
        - **File:** ${{ steps.build.outputs.zip_path }}
        - **Size:** ${{ steps.build.outputs.zip_size }}
        - **SHA256:** ``${{ steps.build.outputs.zip_hash }}``
        
        ## 🔧 Installation
        1. Download and extract the ZIP file below
        2. Double-click ``ezFedMine.exe``
        3. First run automatically downloads XMRig
        4. Mining begins immediately after setup
        
        ## ⛏️ Mining Details
        - **Pool:** ralphfederated.duckdns.org:37888 (P2Pool mini)
        - **Algorithm:** RandomX (CPU mining)
        - **Target:** Ralph's wallet (hashpower donation)
        - **Rig ID:** Your computer name
        
        ## 💻 System Requirements
        - Windows 10/11 (64-bit)
        - ~300 MB RAM for RandomX cache
        - Internet connection for setup and mining
        - Optional: Admin rights for huge pages performance boost
        
        ## 🛡️ Security Notes
        - Windows SmartScreen may show warnings (normal for miners)
        - Click "More info" → "Run anyway" if prompted
        - Add folder to antivirus exclusions if needed
        - Downloads XMRig from official GitHub releases only
        
        ## 🔧 Troubleshooting
        - **Low hashrate?** Wait 30-60 seconds for RandomX warmup
        - **Connection issues?** Test: ``Test-NetConnection ralphfederated.duckdns.org -Port 37888``
        - **Performance boost?** Run as Administrator for huge pages
        
        ## 📞 Support
        Contact Ralph with screenshots if you encounter issues:
        - First 30 lines of ezFedMine output
        - Last 20 lines of XMRig output
        
        ---
        *Happy mining! 🎉⛏️*
        "@
        
        $releaseNotes | Out-File -FilePath "release-notes.md" -Encoding UTF8
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: EZ Fed Mine ${{ steps.version.outputs.version }}
        body_path: release-notes.md
        files: ${{ steps.build.outputs.zip_path }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ezFedMine-${{ steps.version.outputs.version }}
        path: |
          ${{ steps.build.outputs.zip_path }}
          release-notes.md
        retention-days: 30
